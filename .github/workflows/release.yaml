name: release

on:
  push:
    tags:
      - "v[0-9]*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated tag
        run: |
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; push an annotated tag (git tag -a) whose message holds the release notes"
            exit 1
          fi
      # No tool cache in the release job, so a poisoned cache entry cannot
      # reach release artifacts.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - name: Release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Release the tag that triggered this run. GoReleaser would pick
          # the highest tag on the commit by git's version sort, which ranks
          # v1.0.0-rc.1 above v1.0.0.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
      # Publishing makes the release immutable, so it comes last: a failed
      # attestation can then be retried by re-running the job.
      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # Puts a stable release into the package repository within minutes instead
  # of at the next daily run. It is a job of its own, so that it can be
  # re-run without releasing again. Pre-releases are not packaged.
  packages:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run the packages workflow
        run: gh workflow run packages.yaml --ref main -f brig-tag="$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
