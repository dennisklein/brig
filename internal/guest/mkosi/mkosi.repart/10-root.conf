#
# The root file system, as small as possible. mkosi's default for Fedora is
# btrfs; brig uses ext4. Type=root sets the grow-file-system GPT flag, so the
# booted VM grows the file system once usr/lib/repart.d/ (extra tree) has
# grown the partition to fill the VM's root disk.

[Partition]
Type=root
Format=ext4
CopyFiles=/
Minimize=guess
