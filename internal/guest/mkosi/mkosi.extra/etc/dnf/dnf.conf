#
# See dnf5.conf(5). brig VMs get new kernels by moving to a new base image,
# never by updating in place. Exclude only the packages that install a
# kernel or its modules: kernel-headers, kernel-devel and kernel-tools must
# stay installable, e.g. for gcc, which needs kernel-headers.

[main]
excludepkgs=kernel,kernel-core,kernel-modules,kernel-modules-core,kernel-modules-extra,kernel-uki-virt
