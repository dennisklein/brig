#
# Key-only logins for agent and root. sshd uses the first value it reads, so
# this file sorts before Fedora's 50-redhat.conf.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
AllowUsers agent root
# The per-VM key that brig passes in at boot and pins on the host.
HostKey /etc/ssh/ssh_host_ed25519_key
