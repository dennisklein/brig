#
# OpenShell gateway configuration of brig VMs, selected by
# OPENSHELL_GATEWAY_CONFIG. The settings are those of OpenShell's RPM default,
# deploy/rpm/gateway.toml.default (v0.1.2): rootless Podman, primary listener
# on the built-in default 127.0.0.1:17670.

[openshell]
version = 2

[openshell.gateway]
compute_driver = "podman"

[openshell.drivers.podman]
health_check_interval_secs = 10
