#
# Rootless dockerd sets up its networks with iptables in its own network
# namespace, but cannot load the kernel modules of iptables' tables there.
# Without them it fails with "can't initialize iptables table nat".
ip_tables
iptable_filter
iptable_nat
ip6_tables
ip6table_filter
ip6table_nat
