#
# brig runs one gateway per VM, as agent, with an image-owned configuration.
# brig writes ~/.config/brig/gateway.env at boot to switch to
# gateway-mounts.toml when the VM has sandbox mounts; EnvironmentFile=
# settings override Environment=, later files override earlier ones.

[Unit]
ConditionUser=agent

[Service]
Environment=OPENSHELL_GATEWAY_CONFIG=/usr/share/brig/gateway.toml
Environment=OPENSHELL_TELEMETRY_ENABLED=false
EnvironmentFile=-%E/brig/gateway.env
