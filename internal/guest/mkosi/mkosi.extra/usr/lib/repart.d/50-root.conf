#
# systemd-repart.service grows the root partition to the end of the VM's root
# disk on boot. The partition carries the grow-file-system GPT flag, so
# systemd-gpt-auto-generator hooks up systemd-growfs-root.service to grow the
# file system afterwards.

[Partition]
Type=root
