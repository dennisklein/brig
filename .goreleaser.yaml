# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: brig

builds:
  - id: brig
    main: .
    binary: brig
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/dennisklein/brig/internal/version.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: brig
    formats:
      - tar.gz
    # Default-style asset names (brig_0.1.0_linux_amd64.tar.gz) are what
    # `mise use github:dennisklein/brig` auto-detects.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Fixed ownership and timestamps make archives reproducible.
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &fileinfo
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: NOTICE
        info: *fileinfo
      - src: README.md
        info: *fileinfo

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Release notes are the annotated tag message, not a generated changelog.
changelog:
  disable: true

release:
  name_template: "{{ .Tag }}"
  # Leave the release a draft; the workflow publishes it after attesting the
  # assets. A published release is immutable, so attesting after publishing
  # could not be retried. A re-run replaces the draft.
  draft: true
  replace_existing_draft: true
  # Tags like v1.0.0-rc.1 are published as GitHub pre-releases.
  prerelease: auto
  # Subject and body only; .TagContents would include a signed tag's
  # signature block.
  header: |
    {{ .TagSubject }}

    {{ .TagBody }}
