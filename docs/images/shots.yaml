# The screenshots of brig ui in the docs. tools/screenshots takes them from
# brig ui --demo --still, once per shot, theme (light and dark) and size,
# into NAME-light.png, NAME-dark.png and, for the size phone,
# NAME-phone-light.png and NAME-phone-dark.png. Do not edit the images: change
# this list, the UI or the demo, and run
#
#   go build -o brig . && (cd tools/screenshots && go run . -brig ../../brig)
#
# Fields: name; alt, the text that stands for the image; path, the page to
# open; steps, run on it first (click SELECTOR, dialog ACTION-PATH, wait
# SELECTOR, type TEXT into SELECTOR); crop, the selector of the element to
# take instead of the window; fit, to shorten the window to a short page;
# sizes, default desktop; page or action, the page or action of the UI
# reference that shows the shot (docs/reference/ui.md; go generate puts it
# there).
sizes:
  desktop: {width: 1440, height: 900}
  phone: {width: 390, height: 844}
shots:
  - name: overview
    alt: "Overview: a card for each of three VMs, then what needs attention and what brig did lately"
    path: /
    page: overview
    sizes: [desktop, phone]

  - name: vms
    alt: "VMs: one row for each VM with its state, gateway, size, network profile and base image"
    path: /vms
    page: vms
    fit: true

  - name: vm
    alt: "A VM: its state, the OpenShell version, disks and the host checks that concern it"
    path: /vms/dev
    page: vm

  - name: vm-mounts
    alt: "A VM's Mounts tab: the host directories shared with the VM and whether each is a sandbox volume"
    path: /vms/dev?tab=mounts
    page: vm
    fit: true

  - name: vm-network
    alt: "A VM's Network tab: the network profile and what it lets through, the two fences"
    path: /vms/dev?tab=network
    page: vm
    fit: true

  - name: images
    alt: "Images: the base images that VMs are made from and which VMs use each"
    path: /images
    page: images
    fit: true

  - name: host
    alt: "Host: the brig doctor checks, and the audit trail of each VM"
    path: /host
    page: host

  - name: activity
    alt: "Activity: what brig did, from brig ui or a terminal, newest first"
    path: /activity
    page: activity
    fit: true

  - name: sandboxes
    alt: "Sandboxes: every sandbox of every VM's gateway with its state, image, providers and policy version"
    path: /sandboxes
    page: sandboxes
    fit: true

  - name: sandbox
    alt: "A sandbox: its providers, setup and the commands to connect to it from a terminal"
    path: /sandboxes/dev/default/webapp
    page: sandbox

  - name: sandbox-policy
    alt: "A sandbox's Policy tab: the policy it was created with next to the effective policy"
    path: /sandboxes/dev/default/webapp?tab=policy
    page: sandbox

  - name: sandbox-traffic
    alt: "A sandbox's Traffic tab: its requests and the rule that allowed or the reason that denied each"
    path: /sandboxes/dev/default/webapp?tab=traffic
    page: sandbox

  - name: gateway
    alt: "Gateway: what a VM's OpenShell gateway holds, starting with its providers"
    path: /gateways/dev
    page: gateway

  - name: traffic
    alt: "Traffic: the requests of all sandboxes with their verdicts, and Allow for a denied one"
    path: /traffic
    page: traffic

  - name: topology
    alt: "Topology: the path from this host through gateways, sandboxes and providers to the endpoints they reached"
    path: /topology
    page: topology

  - name: new-vm
    alt: "The New VM dialog, with the brig create command it runs"
    path: /
    steps: [{dialog: create}, {type: scratch, into: "#v-name"}]
    crop: "#layer .modal"
    action: create

  - name: mount-add
    alt: "The Share a host directory dialog, with the brig update command it runs"
    path: /vms/dev?tab=mounts
    steps: [{dialog: "mount-add?vm=dev"}, {type: "~/src/notes", into: "#m-src"}]
    crop: "#layer .modal"
    action: mount-add

  - name: sandbox-create
    alt: "The New sandbox dialog, with the brig sandbox create command it runs"
    path: /sandboxes
    steps:
      - dialog: sandbox-create
      - {type: notes, into: "#s-name"}
      - {type: "localhost/pi-agent:2026-10-08", into: "#s-image"}
      - click: "input[name=provider][value=llm]"
      - click: "input[name=provider][value=github]"
      - {type: "~/src/notes:/mnt/notes", into: "#s-mounts"}
    crop: "#layer .modal"
    action: sandbox-create

  - name: allow
    alt: "The Allow dialog for a denied request, with the brig policy allow command it runs"
    path: /traffic
    steps: [{dialog: "allow?req=70&sandbox=webapp&vm=dev&workspace=default"}]
    crop: "#layer .modal"
    action: allow

  - name: help
    alt: "The help pane of the Overview, with its words, its how-tos and the keys"
    path: /
    steps: [{click: "[data-help-toggle]"}]
